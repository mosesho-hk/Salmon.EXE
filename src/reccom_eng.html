<!DOCTYPE html>
<html lang="en">
<head>
<title>Reccomendation Engine</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; }
  .page-layout { display: flex; min-height: 100vh; }
  .sidebar-frame { width: 280px; min-height: 100vh; flex: 0 0 280px; border: 0; }
  .page-content { flex: 1; min-width: 0; padding: 1.5rem; }
</style>
</head>
<body>
<div class="page-layout">
  <iframe class="sidebar-frame" src="side.html?active=reccom_eng.html" title="Sidebar navigation"></iframe>
  <main class="page-content">
    <div id="engine">
      <h1>Reccomendation Engine</h1>

      <div class="w3-card w3-container">
        <h2>Inputs</h2>
    
        <label for="budget">Budget:</label>
        <input type="text" id="budget" name="budget" inputmode="decimal" title="Maximum budget in NOK" aria-label="Budget in NOK"><br><br>

        <label for="quantity">Quantity:</label>
        <input type="text" id="quantity" name="quantity" inputmode="decimal" title="Required quantity in kilograms" aria-label="Quantity in kilograms"><br><br>

        <label for="deadline">Deadline:</label>
        <input type="text" id="deadline" name="deadline" inputmode="numeric" title="Number of weeks from the first forecast week (1–52)" aria-label="Deadline in weeks"><br><br>

        <button onclick="generateRecommendation()">Calculate Best Option</button>

        <h2>Results</h2>

        <p id="result-status" role="status" aria-live="polite">Enter your requirements to calculate a recommendation.</p>
        <div id="recommendation-results" hidden>
          <table class="w3-table w3-bordered">
            <thead><tr><th scope="col">When to buy</th><th scope="col">Buy price (NOK/kg)</th><th scope="col">Quantity (kg)</th></tr></thead>
            <tbody id="recommendation-rows"></tbody>
          </table>
          <p id="recommendation-total"></p>
          <p id="recommendation-note"></p>
        </div>

      </div>
    </div>
  </main>
</div>
<script src="recommendation.js" defer></script>
</body>
</html>

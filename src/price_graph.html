<!DOCTYPE html>
<html lang="en">
<head>
<title>Price forecast | Salmon.EXE</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary" style="--bs-body-font-family: 'Montserrat', sans-serif; background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.5)), url('salmon.png') center / cover no-repeat fixed;">
<div class="container-fluid px-0"><div class="row g-0 min-vh-100">
  <aside class="col-4 col-md-3 col-xl-2 sticky-top align-self-start vh-100 bg-body-tertiary"><iframe class="w-100 vh-100 border-0 d-block" src="side.html?active=price_graph.html" title="Sidebar navigation"></iframe></aside>
  <main class="col-8 col-md-9 col-xl-10 p-3 p-lg-4">
    <div class="container-fluid px-0">
      <h1 class="h2 fw-bold mb-3">Price forecast</h1>
      <p class="mb-4 text-body-secondary">Explore historical salmon exports and the weekly price forecast in one graph.</p>
      <section class="card bg-white shadow-sm rounded-4 p-3 p-lg-4" aria-label="Historical and forecast price graph">
        <p class="small text-body-secondary">Black: historical data. Red: forecast. The shaded area marks the forecast period; it is not a confidence interval.</p>
        <figure class="mb-0">
          <a class="d-block" href="interactive_graph.html?chart=price" aria-label="Open interactive price graph">
            <img class="img-fluid w-100" src="../data/Figure_1.png" width="1539" height="600" alt="Historical salmon price and forecast through 2027. Historical salmon price and forecast in GBP per kilogram, converted from NOK as of 24 October 2026.">
          </a>
          <figcaption class="small text-body-secondary mt-3">Historical salmon price and forecast in GBP per kilogram, converted from NOK as of 24 October 2026.</figcaption>
        </figure>
        <p class="small text-body-secondary mt-2 mb-0">Historical data source: <a href="https://www.ssb.no/en/statbank1/table/03024/" target="_blank" rel="noopener noreferrer">Statistics Norway (SSB), table 03024</a>.</p>
        <a class="align-self-start mt-3" href="interactive_graph.html?chart=price">Open interactive graph</a>
      </section>
    </div>
  </main>
</div></div>
</body>
</html>
